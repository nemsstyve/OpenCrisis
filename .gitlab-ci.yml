stages:
  - install
  - lint
  - build
  - test
  - security
  - docker

image: node:22

# Install
install_front:
  stage: install
  script:
    - echo "Installation frontend"
    - cd 01-frontend 
    - npm install
  artifacts:
    paths:
      - 01-frontend/node_modules/

install_back:
  stage: install
  script:
    - echo "Installation backend"
    - cd 02-backend
    - npm install
  artifacts:
    paths:
      - 02-backend/node_modules/

#Lint
lint_front:
  stage: lint
  script:
    - echo "Lint frontend"
  #  - cd 01-frontend
  #  - npm run lint

lint_back:
  stage: lint
  script:
    - echo "Lint backend"
#    - cd 02-backend
#    - npm run lint

#Verification des secrets
gitleaks_scan:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --report-format json --report-path gitleaks-report.json || true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week
  allow_failure: true

# Build
build_front:
  stage: build
  script:
    - echo "Build frontend"
    - cd 01-frontend
    - npm run build

# Test
test_front:
  stage: test
  script:
    - echo "Test frontend"
    - cd 01-frontend
    - npm run preview & sleep 5
    - echo "Frontend lance"

test_back:
  stage: test
  script:
    - echo "Test backend"
    - cd 02-backend
    - npm start & sleep 5
    - echo "Backend lance"

#Securité semgrep 
semgrep_scan:
  stage: security
  image: semgrep/semgrep:latest
  script:
    - semgrep scan
        --config p/javascript
        --config p/typescript
        --config p/react
        --config p/jwt 
        --config p/security-audit
        --config p/secrets
        --severity ERROR
        --json
        --output semgrep-report.json
        .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week
  allow_failure: true
  when: manual

#trivy changer le format de l'output et criticité
trivy_fs_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --severity HIGH,CRITICAL --format json --output trivy-fs-report.json --no-progress || true
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
    expire_in: 1 week
  allow_failure: true


.docker_rules: &docker_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
 
docker_front:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  <<: *docker_rules
  script:
    - echo "Build Docker image — frontend"
    - docker build -t $CI_REGISTRY_IMAGE/01-frontend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/01-frontend:latest 01-frontend
    - docker push $CI_REGISTRY_IMAGE/01-frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/01-frontend:latest
 
docker_back:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  <<: *docker_rules
  script:
    - echo "Build Docker image — backend"
    - docker build -t $CI_REGISTRY_IMAGE/02-backend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/02-backend:latest 02-backend
    - docker push $CI_REGISTRY_IMAGE/02-backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/02-backend:latest

trivy_image_scan:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  needs:
    - docker_front
    - docker_back
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - trivy image $CI_REGISTRY_IMAGE/01-frontend:$CI_COMMIT_SHORT_SHA --severity HIGH,CRITICAL --format json --output trivy-01-frontend-report.json --no-progress || true
    - trivy image $CI_REGISTRY_IMAGE/02-backend:$CI_COMMIT_SHORT_SHA --severity HIGH,CRITICAL --format json --output trivy-02-backend-report.json --no-progress || true
  artifacts:
    when: always
    paths:
      - trivy-01-frontend-report.json
      - trivy-02-backend-report.json
    expire_in: 1 week
  allow_failure: true
