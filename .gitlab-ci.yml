stages:
  - install
  - lint
  - build
  - test
  - security
  - docker

image: node:22

# Install
install_front:
  stage: install
  script:
    - echo "Installation frontend"
    - cd 01-frontend 
    - npm install
  artifacts:
    paths:
      - 01-frontend/node_modules/
    expire_in: 1 hour
      

install_back:
  stage: install
  script:
    - echo "Installation backend"
    - cd 02-backend
    - npm install
  artifacts:
    paths:
      - 02-backend/node_modules/
    expire_in: 1 hour

#Lint
lint_front:
  stage: lint
  image: node:22-alpine
  dependencies:
    - install_front
  script:
    - cd 01-frontend
    - npx eslint . --format eslint-formatter-gitlab --output-file gl-codequality.json
  artifacts:
    reports:
      codequality: 01-frontend/gl-codequality.json
    expire_in: 1 hour

lint_back:
  stage: lint
  image: node:22-alpine
  dependencies:
    - install_back
  script:
    - cd 02-backend
    - npx eslint . --format eslint-formatter-gitlab --output-file gl-codequality.json
  artifacts:
    reports:
      codequality: 02-backend/gl-codequality.json
    expire_in: 1 hour

#Verification des secrets
gitleaks_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --report-format json --report-path gitleaks-report.json || true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 hour
  allow_failure: true

# Build
build_front:
  stage: build
  script:
    - echo "Build frontend"
    - cd 01-frontend
    - npm run build

# Test
test_front:
  stage: test
  script:
    - echo "Test frontend"
    - cd 01-frontend
    - npm run preview & sleep 5
    - echo "Frontend lance"

test_back:
  stage: test
  script:
    - echo "Test backend"
    - cd 02-backend
    - npm start & sleep 5
    - echo "Backend lance"

#Securité semgrep 
semgrep_scan:
  stage: security
  image: semgrep/semgrep:latest
  script:
    - semgrep scan
        --config p/javascript
        --config p/typescript
        --config p/react
        --config p/jwt 
        --config p/security-audit
        --config p/secrets
        --severity ERROR
        --json
        --output semgrep-report.json
        .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 hour
  allow_failure: true
  when: manual

#trivy changer le format de l'output et criticité
trivy_fs_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --severity HIGH,CRITICAL --format json --output trivy-fs-report.json --no-progress || true
    - trivy config . --format json --output trivy-config-report.json || true

  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
      - trivy-config-report.json
    expire_in: 1 hour
  allow_failure: true