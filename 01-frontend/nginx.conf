server {
    # nginx-unprivileged écoute sur 8080 (port > 1024, non-privilégié)
    # Le reverse proxy nginx principal route vers ce port via http://frontend:8080
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache des assets statiques (Vite génère des noms avec hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback : toutes les routes non trouvées → index.html
    # React Router prend ensuite le relais côté client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
