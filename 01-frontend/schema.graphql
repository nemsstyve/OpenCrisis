type Query
type Mutation

type UserPermission {
    resource: String!
    action: String!
  }

  type Role {
    id: ID!
    name: String!
    description: String
    isSystem: Boolean!
  }

  type User {
    id: ID!
    email: String!
    firstName: String!
    lastName: String!
    phone: String
    company: String
    site: String
    isActive: Boolean!
    mustChangePassword: Boolean!
    createdAt: String!
    roles: [Role!]!
    permissions: [UserPermission!]!
  }

  type AuthPayload {
    accessToken: String!
    user: User!
  }

  extend type Query {
    me: User
  }

  extend type Mutation {
    login(email: String!, password: String!): AuthPayload!
    logout: Boolean!
    refreshToken: AuthPayload!
    changePassword(currentPassword: String!, newPassword: String!): Boolean!
  }

enum IncidentStatus { ACTIVE CONTAINED CLOSED }
  enum Severity { LOW MEDIUM HIGH CRITICAL }

  type Incident {
    id: ID!
    name: String!
    description: String
    status: IncidentStatus!
    severity: Severity!
    startedAt: String!
    resolvedAt: String
    createdBy: User!
    openctiCaseId: String
    createdAt: String!
    updatedAt: String!
  }

  input CreateIncidentInput {
    name: String!
    description: String
    severity: Severity
  }

  input UpdateIncidentInput {
    name: String
    description: String
    status: IncidentStatus
    severity: Severity
  }

  extend type Query {
    incidents: [Incident!]!
    incident(id: ID!): Incident
  }

  extend type Mutation {
    createIncident(input: CreateIncidentInput!): Incident!
    updateIncident(id: ID!, input: UpdateIncidentInput!): Incident!
    deleteIncident(id: ID!): Boolean!
  }

  type Subscription {
    incidentCreated: Incident!
    incidentStatusChanged(incidentId: ID!): Incident!
  }

enum Cell { DIRECTIONAL OPERATIONAL SHARED }

  type LogEntry {
    id: ID!
    incidentId: ID!
    cell: Cell!
    content: String!
    author: User!
    isEdited: Boolean!
    editedAt: String
    createdAt: String!
    updatedAt: String!
    tags: [Tag!]!
  }

  extend type Query {
    logEntries(incidentId: ID!, cell: Cell): [LogEntry!]!
  }

  extend type Mutation {
    createLogEntry(incidentId: ID!, cell: Cell!, content: String!): LogEntry!
    editLogEntry(id: ID!, content: String!): LogEntry!
    deleteLogEntry(id: ID!): Boolean!
    addTagToLogEntry(logEntryId: ID!, tagId: ID!): LogEntry!
    removeTagFromLogEntry(logEntryId: ID!, tagId: ID!): LogEntry!
  }

  extend type Subscription {
    logEntryAdded(incidentId: ID!, cell: Cell): LogEntry!
    logEntryUpdated(incidentId: ID!, cell: Cell): LogEntry!
  }

type Tag {
    id: ID!
    name: String!
    color: String!
  }

  extend type Query {
    tags: [Tag!]!
  }

  extend type Mutation {
    createTag(name: String!, color: String): Tag!
    deleteTag(id: ID!): Boolean!
  }

enum TimelineEventType {
    DETECTION
    ACTION
    DECISION
    COMMUNICATION
    ESCALATION
    RESOLUTION
  }

  type TimelineEvent {
    id: ID!
    incidentId: ID!
    type: TimelineEventType!
    title: String!
    description: String
    occurredAt: String!
    isFirstDetection: Boolean!
    actor: User
    ipAddress: String
    assetName: String
    affectedUser: String
    openctiEntityId: String
    openctiEntityType: String
    createdAt: String!
    updatedAt: String!
  }

  input CreateTimelineEventInput {
    type: TimelineEventType!
    title: String!
    description: String
    occurredAt: String!
    isFirstDetection: Boolean
    actorId: ID
    ipAddress: String
    assetName: String
    affectedUser: String
  }

  input UpdateTimelineEventInput {
    type: TimelineEventType
    title: String
    description: String
    occurredAt: String
    isFirstDetection: Boolean
    ipAddress: String
    assetName: String
    affectedUser: String
  }

  extend type Query {
    timelineEvents(incidentId: ID!): [TimelineEvent!]!
    timelineEvent(id: ID!): TimelineEvent
  }

  extend type Mutation {
    createTimelineEvent(incidentId: ID!, input: CreateTimelineEventInput!): TimelineEvent!
    updateTimelineEvent(id: ID!, input: UpdateTimelineEventInput!): TimelineEvent!
    deleteTimelineEvent(id: ID!): Boolean!
  }

  extend type Subscription {
    timelineEventAdded(incidentId: ID!): TimelineEvent!
  }

enum DocumentCategory { ARTIFACT FICHE_REFLEXE RAPPORT PROCEDURE OTHER }

  type Document {
    id: ID!
    incidentId: ID
    timelineEventId: ID
    name: String!
    mimeType: String!
    sizeBytes: Int!
    category: DocumentCategory!
    uploadedBy: User!
    createdAt: String!
  }

  extend type Query {
    documents(incidentId: ID, category: DocumentCategory): [Document!]!
    document(id: ID!): Document
  }

  extend type Mutation {
    deleteDocument(id: ID!): Boolean!
  }

  extend type Subscription {
    documentUploaded(incidentId: ID!): Document!
  }

type Contact {
    id: ID!
    firstName: String!
    lastName: String!
    role: String!
    organization: String
    phone: String
    email: String
    site: String
    notes: String
    createdAt: String!
    updatedAt: String!
  }

  input CreateContactInput {
    firstName: String!
    lastName: String!
    role: String!
    organization: String
    phone: String
    email: String
    site: String
    notes: String
  }

  input UpdateContactInput {
    firstName: String
    lastName: String
    role: String
    organization: String
    phone: String
    email: String
    site: String
    notes: String
  }

  extend type Query {
    contacts: [Contact!]!
    contact(id: ID!): Contact
  }

  extend type Mutation {
    createContact(input: CreateContactInput!): Contact!
    updateContact(id: ID!, input: UpdateContactInput!): Contact!
    deleteContact(id: ID!): Boolean!
  }

