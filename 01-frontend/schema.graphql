  input AdminCreateUserInput {
    email: String!
    password: String!
    firstName: String!
    lastName: String!
    phone: String
    company: String
    site: String
  }

  input AdminUpdateUserInput {
    firstName: String
    lastName: String
    phone: String
    company: String
    site: String
    isActive: Boolean
  }

  input AdminCreateRoleInput {
    name: String!
    description: String
    permissionIds: [ID!]!
  }

  # â”€â”€ Queries â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  extend type Query {
    adminUsers: [User!]!
    adminRoles: [RoleDetail!]!
    adminPermissions: [Permission!]!
    adminAuditLogs(incidentId: ID, limit: Int, offset: Int): AuditLogPage!
  }

  # â”€â”€ Mutations â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  extend type Mutation {
    adminCreateUser(input: AdminCreateUserInput!, roleIds: [ID!]): User!
    adminUpdateUser(id: ID!, input: AdminUpdateUserInput!): User!
    adminDeleteUser(id: ID!): Boolean!
    adminAssignRole(userId: ID!, roleId: ID!): Boolean!
    adminRemoveRole(userId: ID!, roleId: ID!): Boolean!
    adminCreateRole(input: AdminCreateRoleInput!): RoleDetail!
    adminDeleteRole(id: ID!): Boolean!
    adminUpdateRolePermissions(roleId: ID!, permissionIds: [ID!]!): RoleDetail!
    adminResetPassword(userId: ID!, newPassword: String!): Boolean!
  }


