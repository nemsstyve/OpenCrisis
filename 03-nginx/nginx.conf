worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Masquer la version nginx dans les headers
    server_tokens off;

    # Taille max des uploads (documents, artefacts)
    client_max_body_size 50M;

    # ─── UPSTREAM ─────────────────────────────────────────────────────────────
    upstream backend {
        server backend:4000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ─── SERVEUR PRINCIPAL ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Headers de sécurité (OWASP A05) ──
        add_header X-Content-Type-Options   "nosniff"           always;
        add_header X-Frame-Options          "DENY"              always;
        add_header Referrer-Policy          "strict-origin"     always;
        add_header X-XSS-Protection         "1; mode=block"     always;

        # ── GraphQL + WebSocket subscriptions ──
        # Le chemin /api/graphql doit supporter l'upgrade WebSocket
        # pour que graphql-ws fonctionne (subscriptions temps réel)
        location /api/graphql {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers nécessaires pour le WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout long pour les connexions WebSocket persistantes
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── REST API (auth, fichiers, health) ──
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
        }

        # ── Frontend SPA ──
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Permettre au frontend de gérer le routage client-side
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        # Fallback SPA : toute route inconnue renvoie vers le frontend
        # React Router gère ensuite la navigation côté client
        location @frontend_fallback {
            proxy_pass http://frontend;
        }
    }
}
