# ════════════════════════════════════════════════════════════════════════════
# OpenCrisis — Reverse proxy nginx (durci HTTPS)
# ════════════════════════════════════════════════════════════════════════════
# Fonctionnalités :
#   - HTTPS TLS 1.2 / 1.3 avec ciphers ECDHE-RSA-AES-GCM uniquement (sans DHE)
#   - Redirection 301 HTTP → HTTPS
#   - HSTS max-age=3600 (1h, prudent pendant la phase démo)
#   - Rate limiting : général (200 req/min), upload (20 req/min)
#     (le rate-limit login est géré en mémoire côté backend — services/auth.ts)
#   - Headers de sécurité OWASP : CSP stricte, X-Frame, Permissions-Policy, etc.
#     (X-XSS-Protection retiré : déprécié, remplacé par la CSP)
#   - CSP connect-src restreinte à wss://$host (même origine, pas wss: global)
#   - Blocage des fichiers sensibles : .env .log .sql .sh .bak et fichiers cachés
#   - WebSocket support pour les GraphQL subscriptions (graphql-ws)
#   - server_tokens off + proxy_hide_header X-Powered-By
# ════════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Masquer la version nginx dans les headers (OWASP A05)
    server_tokens off;

    # Cacher le header X-Powered-By renvoyé par Express (ceinture-bretelles
    # avec helmet côté backend qui le supprime déjà)
    proxy_hide_header X-Powered-By;

    # Taille max des uploads (cohérent avec la limite multer côté backend)
    client_max_body_size 50M;

    # ─── ZONES DE RATE LIMITING ───────────────────────────────────────────────
    # Une zone partagée stocke un compteur par IP. La mémoire (10m = 10 Mo)
    # suffit pour environ 160 000 IPs uniques.
    #
    # Note : il n'existe pas de route HTTP dédiée /api/auth/login.
    # Le login est une mutation GraphQL (POST /api/graphql) — voir resolvers/auth.ts.
    # Le rate-limiting anti-bruteforce est géré en mémoire côté backend (services/auth.ts).
    # La zone générale (200/min) s'applique à tout le trafic, y compris les mutations login.
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=20r/m;

    # ─── CONFIGURATION SSL/TLS ────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # ECDHE uniquement (Perfect Forward Secrecy sans paramètres DH externes requis).
    # Les suites DHE retirées : elles nécessitent ssl_dhparam explicite, sans quoi
    # nginx utilise des paramètres DH par défaut potentiellement faibles.
    ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # ─── UPSTREAMS ────────────────────────────────────────────────────────────
    upstream backend {
        server backend:4000;
    }

    upstream frontend {
        server frontend:8080;     # nginx-unprivileged écoute sur 8080
    }

    # ═════════════════════════════════════════════════════════════════════════
    # SERVEUR HTTP — redirection systématique vers HTTPS
    # ═════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Redirection 301 (permanente) vers HTTPS
        return 301 https://$host$request_uri;
    }

    # ═════════════════════════════════════════════════════════════════════════
    # SERVEUR HTTPS — point d'entrée applicatif
    # ═════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ── Rate limit général appliqué à toute la zone HTTPS ──
        limit_req zone=general burst=50 nodelay;

        # ── HEADERS DE SÉCURITÉ (OWASP A05) ──
        # HSTS court (1h) pour la phase démo — augmenter à 31536000 (1 an) en prod réelle
        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;

        add_header X-Content-Type-Options   "nosniff"               always;
        add_header X-Frame-Options          "DENY"                  always;
        # X-XSS-Protection retiré : déprécié depuis 2019, ignoré par les navigateurs
        # modernes et source de vulnérabilités dans IE. La CSP ci-dessous couvre ce cas.
        add_header Referrer-Policy          "strict-origin"         always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()" always;

        # CSP stricte
        #   - script-src 'self' : pas de scripts inline ni externes
        #   - style-src 'unsafe-inline' : nécessaire pour Vite/React (CSS-in-JS, etc.)
        #   - connect-src 'self' wss://$host : WebSocket restreint au même hôte que la requête.
        #     $host est expansé par nginx → wss://localhost en dev, wss://mondomaine.fr en prod.
        #     wss: (sans hôte) est trop permissif : autoriserait n'importe quel serveur WebSocket.
        #   - frame-ancestors 'none' : équivalent X-Frame-Options DENY
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # ─── BLOCAGE FICHIERS SENSIBLES ──────────────────────────────────────
        # Toute tentative d'accès à un fichier sensible renvoie 403 sans log
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~* \.(env|log|sql|sh|bak|swp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── UPLOADS — rate limit + timeout étendu ───────────────────────────
        # 20 uploads/minute par IP, body max 50M (hérité du http {} global)
        location /api/files/ {
            limit_req zone=upload burst=5 nodelay;

            proxy_pass http://backend/files/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout long pour les uploads volumineux
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ─── GRAPHQL + WEBSOCKET SUBSCRIPTIONS ───────────────────────────────
        # Le chemin /api/graphql doit supporter l'upgrade WebSocket
        # pour que graphql-ws fonctionne (subscriptions temps réel)
        location /api/graphql {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers nécessaires pour l'upgrade WebSocket
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout long pour les connexions WebSocket persistantes
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── REST API (auth refresh, health, autres routes) ──────────────────
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
        }

        # ─── FRONTEND SPA ────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Permettre au frontend de gérer le routage client-side
            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        # Fallback SPA : toute route inconnue renvoie vers le frontend
        # React Router gère ensuite la navigation côté client
        location @frontend_fallback {
            proxy_pass http://frontend;
        }
    }
}
