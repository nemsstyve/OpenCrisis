# ════════════════════════════════════════════════════════════════════════════
# OpenCrisis — docker-compose.yml (durci infra v1)
# ════════════════════════════════════════════════════════════════════════════
# Stack : 5 services applicatifs (nginx, frontend, backend, postgres, redis)
# Durcissement appliqué :
#   - security_opt: no-new-privileges sur tous les services
#   - cap_drop: ALL + cap_add sélectif (principe du moindre privilège)
#   - Limites CPU/RAM par service
#   - Deux réseaux : frontend-network + backend-network (internal: true)
#   - Images pinnées sur versions précises (build reproductible)
#   - Frontend en nginx-unprivileged (jamais root, port interne 8080)
# ════════════════════════════════════════════════════════════════════════════

services:

  # ── Reverse proxy — seul point d'entrée exposé ─────────────────────────────
  # Nginx route le trafic vers frontend et backend, applique les headers de
  # sécurité et le rate limiting. Sur frontend-network uniquement.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                   # Redirection 301 vers HTTPS
      - "443:443"                 # HTTPS (TLS 1.2/1.3)
    volumes:
      - ./03-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro   # Certificats TLS auto-signés (cf scripts/generate-certs.sh)
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --no-check-certificate https://127.0.0.1 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true   # Interdit toute élévation de privilèges
    cap_drop:
      - ALL                       # Supprime toutes les capabilities Linux
    cap_add:
      - NET_BIND_SERVICE          # Nécessaire pour écouter sur le port 80 (< 1024)
      - CHOWN                     # Le master nginx change l'ownership des sockets
      - SETUID                    # Switch vers l'utilisateur nginx pour les workers
      - SETGID                    # Idem groupe
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Frontend React (nginx-unprivileged, jamais root) ───────────────────────
  # Servi par nginx-unprivileged sur le port interne 8080.
  # Aucun port exposé sur l'hôte : seul le reverse proxy nginx y accède.
  frontend:
    build:
      context: ./01-frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                       # Aucune capability nécessaire (port > 1024, non-root natif)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Backend Node.js / Apollo GraphQL ───────────────────────────────────────
  # Sur les DEUX réseaux : frontend-network pour être atteint par nginx,
  # backend-network pour parler à postgres et redis. Aucun port exposé.
  backend:
    build:
      context: ./02-backend
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OPENCTI_ENABLED: ${OPENCTI_ENABLED:-false}
      OPENCTI_URL: ${OPENCTI_URL:-}
      OPENCTI_TOKEN: ${OPENCTI_TOKEN:-}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend-network          # Pour être atteint par nginx
      - backend-network           # Pour parler à postgres et redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                       # USER node dans le Dockerfile, aucune cap nécessaire
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Sur backend-network uniquement (internal: true), pas d'accès internet.
  # Aucun port exposé sur l'hôte en mode prod (le dev compose ajoute 5432).
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencrisis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opencrisis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencrisis} -d ${POSTGRES_DB:-opencrisis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                     # PostgreSQL change l'ownership des fichiers de données au démarrage
      - SETUID                    # Switch vers l'utilisateur postgres
      - SETGID                    # Switch vers le groupe postgres
      - DAC_READ_SEARCH           # Accès aux fichiers de configuration
      - FOWNER                    # Gestion des droits sur les fichiers de données
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Redis — pub/sub pour les GraphQL subscriptions ─────────────────────────
  # Sur backend-network uniquement (internal: true).
  redis:
    user: "999:999"
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                       # user:999:999 démarre déjà en non-root, aucune cap nécessaire
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

# ─── VOLUMES ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:                  # Données PostgreSQL
  redis_data:                     # Persistance Redis (AOF activée)
  uploads_data:                   # Fichiers uploadés par les utilisateurs

# ─── RÉSEAUX ────────────────────────────────────────────────────────────────
# Deux réseaux isolés :
#   - frontend-network : nginx, frontend, backend (sortie internet possible)
#   - backend-network  : backend, postgres, redis (internal: true, pas d'internet)
# Le backend est le seul service présent sur les deux réseaux : il fait le pont.
networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true                # Aucun accès internet depuis ce réseau
