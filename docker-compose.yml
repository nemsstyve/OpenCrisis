services:
  # ─── REVERSE PROXY ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./03-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - opencrisis
    restart: unless-stopped

  # ─── FRONTEND ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./01-frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opencrisis
    restart: unless-stopped

  # ─── BACKEND ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./02-backend
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OPENCTI_ENABLED: ${OPENCTI_ENABLED:-false}
      OPENCTI_URL: ${OPENCTI_URL:-}
      OPENCTI_TOKEN: ${OPENCTI_TOKEN:-}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opencrisis
    restart: unless-stopped

  # ─── BASE DE DONNÉES ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencrisis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opencrisis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencrisis} -d ${POSTGRES_DB:-opencrisis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencrisis
    restart: unless-stopped

  # ─── REDIS (pub/sub subscriptions) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opencrisis
    restart: unless-stopped

# ─── VOLUMES ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:

# ─── RÉSEAU INTERNE ─────────────────────────────────────────────────────────
networks:
  opencrisis:
    driver: bridge
